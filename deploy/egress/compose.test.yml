# Merged only by the staging harness. Never used for production.
# Every service here is non-root, read-only, and has no added capabilities.
services:
  proxy:
    restart: "no"
    entrypoint: ["squid", "-N", "-f", "/config/squid.conf"]
    volumes:
      - ${TEST_CONF:?set TEST_CONF}:/config/squid.conf:ro
    extra_hosts:
      - "idle.fixture:${FIXTURE_IP:?set FIXTURE_IP}"
      - "blocked.fixture:${FIXTURE_IP}"
      - "metadata.test:169.254.169.254"
      - "lan.test:10.9.9.9"
      - "cgnat.test:100.64.1.1"
      - "loop.test:127.0.0.1"

  fixture:
    image: oven/bun:1.4.4
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    environment:
      HOME: /tmp
    volumes:
      - ${TEST_DIR:?set TEST_DIR}/fixture.js:/opt/fixture.js:ro
      - ${TEST_DIR}/client.js:/opt/client.js:ro
      - ${FIXTURE_DIR:?set FIXTURE_DIR}/srv.crt:/certs/srv.crt:ro
      - ${FIXTURE_DIR}/srv.key:/certs/srv.key:ro
      - ${TEST_DIR}/delay:/delay:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    command: ["bun", "/opt/fixture.js"]
    networks:
      egress:
        ipv4_address: ${FIXTURE_IP}
    restart: "no"

  client:
    image: oven/bun:1.4.4
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    dns:
      - 127.0.0.1
    environment:
      HOME: /tmp
      HEALTH_BIND: ${INGRESS_UPSTREAM_IP}
      HEALTH_PORT: ${INGRESS_LISTEN_PORT}
      HTTPS_PROXY: http://${PROXY_IP}:3128
      HTTP_PROXY: http://${PROXY_IP}:3128
      ALL_PROXY: http://${PROXY_IP}:3128
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      SSL_CERT_FILE: /certs/ca.crt
      IDLE_MS: ${IDLE_MS:-310000}
    volumes:
      - ${TEST_DIR}/client.js:/opt/client.js:ro
      - ${TEST_DIR}/health.js:/opt/health.js:ro
      - ${CLIENT_CA:?set CLIENT_CA}:/certs/ca.crt:ro
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    command: ["bun", "/opt/health.js"]
    restart: "no"
    networks:
      app: {}
      ingress:
        ipv4_address: ${INGRESS_UPSTREAM_IP:?set INGRESS_UPSTREAM_IP}
    depends_on:
      - proxy

  ingress:
    restart: "no"
