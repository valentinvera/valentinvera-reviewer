name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  build:
    needs: checks
    runs-on: ubuntu-latest
    # GHA cache export needs actions:write in addition to the workflow permissions.
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Load the image and scan it before any registry push. provenance is off
      # because the docker exporter cannot load an attestation manifest list;
      # the following push publishes this scanned image, not a second build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: valentinvera-reviewer:candidate
          # Required by the Dockerfile. Unique per run, so mode=max cannot
          # restore a previous apt upgrade layer. The deps stage stays cached.
          build-args: |
            OS_SECURITY_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=valentinvera-reviewer
            org.opencontainers.image.description=GitHub App that reviews pull requests
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
      - name: Scan image before push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: valentinvera-reviewer:candidate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Push scanned image
        run: |
          image="ghcr.io/valentinvera/valentinvera-reviewer"
          docker tag valentinvera-reviewer:candidate "${image}:${GITHUB_SHA}"
          docker tag valentinvera-reviewer:candidate "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: "tag:ci"
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - uses: actions/checkout@v7
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20"
          # shellcheck disable=SC2086
          scp $opts deploy/egress/deploy-app.sh "deploy@${DEPLOY_HOST}:/tmp/valentinvera-reviewer-deploy-app.sh"
          echo "$GITHUB_TOKEN" | ssh $opts "deploy@${DEPLOY_HOST}" \
            "read -r GITHUB_TOKEN; export GITHUB_TOKEN; exec sh /tmp/valentinvera-reviewer-deploy-app.sh ${GITHUB_SHA}"
