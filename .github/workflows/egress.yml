name: egress

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run secret-free static harness checks
        run: deploy/egress/test-egress.sh
