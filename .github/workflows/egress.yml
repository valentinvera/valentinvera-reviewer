name: egress

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Run secret-free static harness checks
        run: deploy/egress/test-egress.sh
